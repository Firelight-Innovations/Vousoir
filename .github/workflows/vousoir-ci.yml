name: Vousoir CI

# Work order §9.12: build + lint + dependency-cruiser + unit tests on Windows (primary);
# macOS and Linux build jobs exist and are kept green (build-only is sufficient for v1).
# This workflow governs the Vousoir layer and the fork's build. code-oss's own upstream
# workflows are left in place, untouched (§7.4).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: vousoir-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Primary gate: the Vousoir compartmentalization + lint + type + test wall (Windows) ──
  vousoir-layer:
    name: Vousoir layer (lint · dep-check · typecheck · test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: nvm
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvm.outputs.version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Vousoir workspace
        working-directory: vousoir
        run: pnpm install --frozen-lockfile

      - name: Lint (strict — warnings and errors both fail CI)
        working-directory: vousoir
        run: pnpm run lint:strict

      - name: Boundary check (dependency-cruiser)
        working-directory: vousoir
        run: pnpm run dep-check

      - name: Typecheck (strict TS)
        working-directory: vousoir
        run: pnpm run typecheck

      - name: Unit tests
        working-directory: vousoir
        run: pnpm run test

  # ── Fork build: code-oss compiles on all three platforms (build-only for v1) ──
  build:
    name: Build code-oss (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Node version
        id: nvm
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvm.outputs.version }}

      - name: Set up Python (node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux build prerequisites (native modules + electron)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot

      - name: Install dependencies (npm — code-oss toolchain)
        run: npm ci

      - name: Compile
        run: npm run compile
