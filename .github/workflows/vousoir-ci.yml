name: Vousoir CI

# Work order §9.12: build + lint + dependency-cruiser + unit tests on Windows (primary);
# macOS and Linux build jobs exist and are kept green (build-only is sufficient for v1).
# This workflow governs the Vousoir layer and the fork's build. code-oss's own upstream
# workflows are left in place, untouched (§7.4).

on:
  # `pull_request` covers every branch under review. Pushing to a branch that has an
  # open PR would otherwise run this whole workflow a second time on an identical tree
  # — the two runs land in different concurrency groups (`refs/heads/x` vs
  # `refs/pull/N/merge`), so neither cancels the other and every check appears twice.
  # Restricting `push` to the integration branches keeps direct pushes covered without
  # duplicating PR runs.
  push:
    branches: [main, debrand-base]
  pull_request:
  workflow_dispatch:

concurrency:
  group: vousoir-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Primary gate: the Vousoir compartmentalization + lint + type + test wall (Windows) ──
  vousoir-layer:
    name: Vousoir layer (lint · dep-check · typecheck · test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Node version
        id: nvm
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvm.outputs.version }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Vousoir workspace
        working-directory: vousoir
        run: pnpm install --frozen-lockfile

      - name: Lint (strict — warnings and errors both fail CI)
        working-directory: vousoir
        run: pnpm run lint:strict

      - name: Boundary check (dependency-cruiser)
        working-directory: vousoir
        run: pnpm run dep-check

      - name: Typecheck (strict TS)
        working-directory: vousoir
        run: pnpm run typecheck

      - name: Unit tests
        working-directory: vousoir
        run: pnpm run test

  # ── Fork build: code-oss compiles on all three platforms (build-only for v1) ──
  build:
    name: Build code-oss (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A green build takes ~6 minutes. The cap is a backstop against the install retry
    # amplifying a *deterministic* failure: when the toolchain check below was broken,
    # five attempts turned a 4-minute failure into a 19-minute one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Node version
        id: nvm
        shell: bash
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.nvm.outputs.version }}

      - name: Set up Python (node-gyp)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Linux build prerequisites (native modules + electron)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev fakeroot

      # `npm ci` here pulls binary artifacts from third-party hosts (@vscode/ripgrep
      # fetches a release asset from GitHub, node-gyp fetches headers). Those are
      # rate-limited and fail transiently — a ripgrep 403 is what killed the build on
      # PR #10 with no relation to the diff. Upstream's own pr.yml retries five times
      # for the same reason; match it so a rate limit doesn't read as a code failure.
      - name: Install dependencies (npm — code-oss toolchain)
        shell: bash
        run: |
          set -e
          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo "npm ci failed five times — giving up" >&2
              exit 1
            fi
            echo "npm ci failed (attempt $i/5); retrying in $((i * 15))s..."
            sleep $((i * 15))
          done

      - name: Compile
        run: npm run compile
